<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeFlow</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <div id="login-section" class="section">
      <h2>ResumeFlow 登录</h2>
      <div class="form-group">
        <label>后端地址</label>
        <input type="text" id="backend-url" value="http://123.57.70.7" placeholder="http://123.57.70.7" />
      </div>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <button id="btn-login" class="btn btn-primary">登录</button>
      <p id="login-msg" class="msg"></p>
    </div>

    <div id="main-section" class="section" style="display:none;">
      <div class="header">
        <span id="user-info"></span>
        <button id="btn-logout" class="btn btn-small">退出</button>
      </div>

      <div class="card">
        <h3>悬浮面板</h3>
        <button id="btn-toggle-panel" class="btn btn-primary btn-block">打开 / 切换悬浮面板</button>
        <button id="btn-close-panel" class="btn btn-secondary btn-block">关闭当前页面面板</button>
        <p class="tip">也可以直接点击浏览器工具栏的插件图标开关面板。</p>
      </div>

      <div class="card">
        <h3>数据同步</h3>
        <div id="sync-status" class="sync-status">检测中…</div>
        <button id="btn-sync" class="btn btn-secondary btn-block">手动同步最新数据</button>
        <p id="sync-msg" class="msg"></p>
      </div>

      <div class="card">
        <button id="btn-open-admin" class="btn btn-block">打开管理后台</button>
        <button id="btn-options" class="btn btn-block">设置（后端地址）</button>
      </div>
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
