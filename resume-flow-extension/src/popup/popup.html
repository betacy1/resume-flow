<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeFlow 填表助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <div id="login-section" class="section">
      <h2>ResumeFlow 登录</h2>
      <div class="form-group">
        <label>后端地址</label>
        <input type="text" id="backend-url" value="http://localhost:8080" placeholder="http://localhost:8080" />
      </div>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" />
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" />
      </div>
      <button id="btn-login" class="btn btn-primary">登录</button>
      <p id="login-msg" class="msg"></p>
    </div>

    <div id="main-section" class="section" style="display:none;">
      <div class="header">
        <span id="user-info"></span>
        <button id="btn-logout" class="btn btn-small">退出</button>
      </div>

      <div class="card">
        <div class="form-group">
          <label>当前岗位模板</label>
          <select id="template-select"></select>
        </div>
        <button id="btn-scan-fill" class="btn btn-primary btn-block">一键填写当前页面</button>
        <p id="fill-result" class="msg"></p>
      </div>

      <div class="card" id="confirm-card" style="display:none;">
        <h3>建议人工确认（置信度 0.5~0.75）</h3>
        <div id="confirm-list" class="field-list"></div>
      </div>

      <div class="card" id="unmatched-card" style="display:none;">
        <h3>未匹配字段（可绑定到简历字段）</h3>
        <div id="unmatched-list" class="field-list"></div>
      </div>

      <div class="card">
        <h3>字段快速编辑</h3>
        <div class="form-group">
          <select id="field-select"></select>
        </div>
        <div class="form-group">
          <textarea id="field-value" rows="4" placeholder="编辑字段内容"></textarea>
        </div>
        <button id="btn-save-field" class="btn btn-secondary btn-block">保存字段内容</button>
      </div>

      <div class="card">
        <h3>素材快速新增</h3>
        <div class="form-group"><input id="material-title" placeholder="素材标题" /></div>
        <div class="form-group">
          <select id="material-type"></select>
        </div>
        <div class="form-group"><textarea id="material-content" rows="4" placeholder="素材内容"></textarea></div>
        <button id="btn-add-material" class="btn btn-secondary btn-block">新增素材</button>
      </div>

      <div class="card">
        <h3>填入当前输入框</h3>
        <div id="material-buttons" class="material-buttons"></div>
      </div>
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
