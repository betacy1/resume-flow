server:
  port: 8081
  # 监听所有网卡，保证容器/远程环境下外部可访问（不能写 127.0.0.1）
  address: 0.0.0.0
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  application:
    name: resume-flow-backend

# JWT 配置
jwt:
  secret: resume-flow-jwt-secret-key-2024-very-long-secure-string-at-least-256-bits
  expiration: 86400000  # 24小时（毫秒）
  header: Authorization
  prefix: "Bearer "

# ResumeFlow 自定义配置
resumeflow:
  # 敏感字段是否也自动填写（默认 true：身份证/紧急联系人等按普通字段自动填写）
  auto-fill-sensitive: true
  # 敏感字段关键词（仅保留密码类；命中且 auto-fill-sensitive=false 时不自动填写）
  sensitive-keywords:
    - 密码
    - 支付密码
    - password
  # 允许 CORS 的来源
  cors-allowed-origins:
    - "http://localhost:5173"
    - "http://localhost:5174"
    # 阿里云 ECS 公网部署：管理后台与插件均通过公网 IP 访问
    - "http://123.57.70.7"
    - "http://123.57.70.7:*"
    - chrome-extension://*
    - moz-extension://*
    - edge-extension://*

# Knife4j 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.resumeflow: info
    org.hibernate.SQL: warn
