spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:resume_flow}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      platform: mysql
      continue-on-error: true

  h2:
    console:
      enabled: false

# prod 默认不重建 demo 数据；首次部署需要初始化时设置环境变量 DEMO_INIT_ENABLED=true
resumeflow:
  demo-init-enabled: false

logging:
  level:
    com.resumeflow: info
    org.hibernate.SQL: warn
