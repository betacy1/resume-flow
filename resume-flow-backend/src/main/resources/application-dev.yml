spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/resume-flow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      # dev 环境 demo 数据由 DemoDataInitializer 初始化，不加载 SQL 脚本
      mode: never
      continue-on-error: true

logging:
  level:
    org.hibernate.SQL: debug
